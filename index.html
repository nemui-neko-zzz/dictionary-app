<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>ふむふむ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; color: #222; background: #fff; }
  main { padding: calc(env(safe-area-inset-top) + 24px) 16px 80px; }
  .field { position: relative; }
  .field input { padding-right: 36px; }
  .field input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .clear-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: none; background: none; color: #aaa; font-size: 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .topbar h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .headbtns { display: flex; align-items: center; gap: 8px; }
  .sync-btn { background: #f0f0f3; color: #888; border: none; border-radius: 20px; padding: 9px 15px; font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0; min-width: 76px; }
  .sync-btn.on { background: #007aff; color: #fff; }
  .reload-btn { background: #f0f0f3; color: #888; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  input { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; align-items: center; border-bottom: 1px solid #eee; }
  li a { flex: 1; padding: 14px 4px; color: inherit; text-decoration: none; font-size: 17px; }
  li button { border: none; background: none; color: #999; font-size: 14px; padding: 12px 8px; }
  .note { color: #888; font-size: 13px; padding: 12px 4px; }
  .count { color: #888; font-size: 13px; padding: 4px 4px 0; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); width: max-content; max-width: min(90vw, 420px); background: rgba(40,40,40,.88); color: #fff; font-size: 13px; padding: 9px 14px; border-radius: 18px; z-index: 50; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; border-top: 1px solid #ddd; background: #fafafa; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: none; background: none; padding: 12px; font-size: 14px; color: #888; }
  nav button.on { color: #007aff; font-weight: bold; }
  .history-tools { display:flex; gap:8px; margin:4px 0 8px; }
  .history-tools button { flex:1; border:1px solid #ddd; background:#fff; border-radius:18px; padding:8px 4px; color:#666; font-size:13px; }
  .history-tools button.on { background:#eef6ff; border-color:#2685d5; color:#1673c5; font-weight:700; }
  .lang-icon { width:25px; height:25px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; margin:0 9px 0 3px; flex-shrink:0; }
  .lang-ja { background:#e7f2ff; color:#1876c9; }
  .lang-en { background:#e5f7ed; color:#16834a; }
  .history-link { display:flex; align-items:center; flex:1; min-width:0; padding:10px 4px; color:inherit; text-decoration:none; font-size:17px; }
  .history-link span:last-child { overflow-wrap:anywhere; }
  .english-panel { padding-top:4px; }
  .english-panel p { color:#777; font-size:13px; line-height:1.6; }
  .alc-link { display:block; padding:14px; margin:12px 0 18px; border-radius:10px; background:#f2f7f3; color:#167343; text-decoration:none; font-weight:700; text-align:center; }
  .add-row { display:flex; gap:8px; align-items:center; }
  .add-row input { min-width:0; }
  .add-row button { border:0; border-radius:8px; padding:12px 14px; background:#16834a; color:white; font-weight:700; white-space:nowrap; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>ふむふむ</h1>
    <div class="headbtns">
      <button id="syncBtn" class="sync-btn" hidden>同期</button>
      <button id="reloadBtn" class="reload-btn" title="最新に更新" aria-label="最新に更新">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
  <section id="search">
    <div class="field">
      <input id="q" type="search" placeholder="言葉を入力" autocomplete="off">
      <button id="clearBtn" class="clear-btn" aria-label="入力を消す" hidden>✕</button>
    </div>
    <ul id="cands"></ul>
  </section>
  <section id="english" hidden>
    <div class="english-panel">
      <p>英語の意味を調べるときは、公式の英辞郎 on the WEBを利用してください。</p>
      <a class="alc-link" href="https://eow.alc.co.jp/" target="_blank" rel="noopener noreferrer">英辞郎 on the WEBを開く ↗</a>
      <p>調べた単語を下に入力すると、このアプリの履歴に追加できます。</p>
      <div class="add-row">
        <input id="englishWord" type="text" placeholder="調べた英単語・フレーズ" autocomplete="off">
        <button id="addEnglish">履歴に追加</button>
      </div>
    </div>
  </section>
  <section id="history" hidden>
    <div class="history-tools" aria-label="履歴の言語で絞り込み">
      <button type="button" data-filter="all">すべて</button>
      <button type="button" data-filter="ja">日本語</button>
      <button type="button" data-filter="en">英語</button>
    </div>
    <div id="count" class="count"></div>
    <ul id="hist"></ul>
  </section>
</main>
<nav>
  <button id="tabJapanese" class="on">日本語</button>
  <button id="tabEnglish">英語</button>
  <button id="tabHistory">履歴</button>
</nav>

<!-- Firebase (同期用。読み込めない時はローカルのみで動作) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "kotoba";
// コトバンク内の検索1件目に直接飛ぶ(DuckDuckGoの "\" 指定)。飛べない端末でも結果がコトバンクだけになる
const kotobankUrl = w => "https://duckduckgo.com/?q=" + encodeURIComponent("\\" + w + " site:kotobank.jp");

// 古い形式が残っていても動くよう、読み込み時に形を整える
function normalize(d) {
  const raw = d && Array.isArray(d.history) ? d.history : [];
  const h = raw.map(x => {
    if (typeof x === "string") return { word: x, language: "ja" };
    if (x && typeof x.word === "string" && (x.language === "ja" || x.language === "en")) return { word: x.word, language: x.language };
    return null;
  }).filter(Boolean);
  const seen = new Set();
  const unique = h.filter(x => {
    const key = x.language + "|" + x.word;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  return { history: unique, updatedAt: (d && d.updatedAt) || 0 };
}
let state = (() => {
  try {
    const cur = localStorage.getItem(KEY);
    if (cur) return normalize(JSON.parse(cur));
    const old = JSON.parse(localStorage.getItem("history") || "[]"); // 初期版の保存形式
    return normalize({ history: old, updatedAt: old.length ? Date.now() : 0 });
  } catch (e) { return normalize(null); }
})();
let applyingRemote = false;

function save() {
  state.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  if (!applyingRemote) pushToCloud();
}
function addHistory(word, language) {
  const entry = { word, language };
  state.history = [entry, ...state.history.filter(x => !(x.word === word && x.language === language))];
  save();
}
function removeHistory(entry) {
  if (!confirm("「" + entry.word + "」を履歴から削除しますか？")) return;
  state.history = state.history.filter(x => !(x.word === entry.word && x.language === entry.language));
  save();
  renderHistory();
}

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), 2000);
}

function row(word, onRemove) {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.textContent = word;
  a.href = kotobankUrl(word);
  a.rel = "noreferrer";
  a.addEventListener("click", () => { addHistory(word, "ja"); if (onRemove) renderHistory(); });
  li.append(a);
  if (onRemove) {
    const b = document.createElement("button");
    b.textContent = "削除";
    b.addEventListener("click", () => onRemove({ word, language: "ja" }));
    li.append(b);
  }
  return li;
}

let historyFilter = localStorage.getItem("kotobaHistoryFilter") || "all";
if (!["all", "ja", "en"].includes(historyFilter)) historyFilter = "all";
function renderHistory() {
  const ul = $("hist");
  ul.replaceChildren();
  document.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle("on", b.dataset.filter === historyFilter));
  const list = state.history.filter(x => historyFilter === "all" || x.language === historyFilter);
  $("count").textContent = list.length + "件";
  if (!list.length) {
    ul.innerHTML = '<li class="note">まだ履歴はありません</li>';
    return;
  }
  list.forEach(entry => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "history-link";
    a.href = entry.language === "ja" ? kotobankUrl(entry.word) : "https://eow.alc.co.jp/search?q=" + encodeURIComponent(entry.word);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    const icon = document.createElement("span");
    icon.className = "lang-icon " + (entry.language === "ja" ? "lang-ja" : "lang-en");
    icon.textContent = entry.language === "ja" ? "あ" : "A";
    icon.setAttribute("aria-label", entry.language === "ja" ? "日本語" : "英語");
    const label = document.createElement("span");
    label.textContent = entry.word;
    a.append(icon, label);
    li.append(a);
    const b = document.createElement("button");
    b.textContent = "削除";
    b.addEventListener("click", () => removeHistory(entry));
    li.append(b);
    ul.append(li);
  });
}

// 候補はWikipediaの見出し検索から取得(コトバンクには自動アクセスしない)
let timer, seq = 0;
$("q").addEventListener("input", () => {
  $("clearBtn").hidden = !$("q").value;
  clearTimeout(timer);
  timer = setTimeout(suggest, 250);
});
$("clearBtn").onclick = () => {
  $("q").value = "";
  $("clearBtn").hidden = true;
  $("cands").replaceChildren();
  seq++;
  $("q").focus();
};
async function suggest() {
  const text = $("q").value.trim();
  const ul = $("cands");
  ul.replaceChildren();
  if (!text) return;
  const mine = ++seq;
  let words = [];
  try {
    const url = "https://ja.wikipedia.org/w/api.php?action=opensearch&format=json&origin=*&limit=10&search=" + encodeURIComponent(text);
    words = (await (await fetch(url)).json())[1];
  } catch (e) {
    const li = document.createElement("li");
    li.className = "note";
    li.textContent = "候補を取得できませんでした";
    ul.append(li);
  }
  if (mine !== seq) return;
  words.forEach(w => ul.append(row(w)));
  if (!words.includes(text)) ul.append(row(text));
}

function show(tab) {
  $("search").hidden = tab !== "japanese";
  $("english").hidden = tab !== "english";
  $("history").hidden = tab !== "history";
  $("tabJapanese").className = tab === "japanese" ? "on" : "";
  $("tabEnglish").className = tab === "english" ? "on" : "";
  $("tabHistory").className = tab === "history" ? "on" : "";
  if (tab === "history") renderHistory();
}
$("tabJapanese").onclick = () => show("japanese");
$("tabEnglish").onclick = () => show("english");
$("tabHistory").onclick = () => show("history");
$("addEnglish").onclick = () => {
  const input = $("englishWord");
  const word = input.value.trim();
  if (!word) { showToast("単語を入力してください"); return; }
  addHistory(word, "en");
  input.value = "";
  showToast("英語の履歴に追加しました");
};
$("englishWord").addEventListener("keydown", e => {
  if (e.key === "Enter") $("addEnglish").click();
});
document.querySelectorAll("[data-filter]").forEach(b => {
  b.addEventListener("click", () => {
    historyFilter = b.dataset.filter;
    localStorage.setItem("kotobaHistoryFilter", historyFilter);
    renderHistory();
  });
});
$("reloadBtn").onclick = () => location.reload();

/* ===== クラウド同期 (Firebase + Googleログイン) ===== */
// そろそろ・とりあえずと同じFirebaseプロジェクトを使い、保存先だけ別(apps/kotoba)
const firebaseConfig = {
  apiKey: "AIzaSyC6KM0ZiG4boea6h8KL7lGEnREC2Itm9oY",
  authDomain: "cycle-tracker-app-77383.firebaseapp.com",
  projectId: "cycle-tracker-app-77383",
  storageBucket: "cycle-tracker-app-77383.firebasestorage.app",
  messagingSenderId: "217290900134",
  appId: "1:217290900134:web:2c6d1a37ca964e2749ea67"
};
let fbUser = null, fbDb = null, fbUnsub = null;

(function initSync() {
  if (typeof firebase === "undefined") return; // SDK未読込(オフライン等)→ローカルのみ
  try {
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    firebase.auth().getRedirectResult().catch(() => {});
    firebase.auth().onAuthStateChanged(onAuthChanged);
  } catch (e) { console.warn("sync init failed", e); }
  const btn = $("syncBtn");
  btn.hidden = false;
  btn.onclick = onSyncClick;
  renderSyncUI();
})();

function dataDoc() {
  return fbDb.collection("users").doc(fbUser.uid).collection("apps").doc("kotoba");
}
function onAuthChanged(user) {
  fbUser = user;
  renderSyncUI();
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  if (user) startSync();
}
function startSync() {
  dataDoc().get().then(snap => {
    const remote = snap.exists ? snap.data() : null;
    const remoteAt = remote ? (remote.updatedAt || 0) : -1;
    if (remote && remoteAt >= state.updatedAt) applyRemote(remote);
    else pushToCloud(); // ローカルが新しい/クラウドが空 → 上げる
    fbUnsub = dataDoc().onSnapshot(s => {
      if (!s.exists) return;
      const r = s.data();
      if ((r.updatedAt || 0) > state.updatedAt) applyRemote(r);
    });
  }).catch(e => { console.warn(e); showToast("同期の読み込みに失敗"); });
}
function applyRemote(r) {
  applyingRemote = true;
  state = normalize(r);
  localStorage.setItem(KEY, JSON.stringify(state));
  renderHistory();
  applyingRemote = false;
  showToast("同期で最新になりました");
}
function pushToCloud() {
  if (!fbUser || !fbDb) return;
  try { dataDoc().set(JSON.parse(JSON.stringify(state))); }
  catch (e) { console.warn("push failed", e); }
}
function renderSyncUI() {
  const btn = $("syncBtn");
  if (fbUser) { btn.textContent = "同期中"; btn.classList.add("on"); btn.title = (fbUser.email || "") + " / タップでログアウト"; }
  else { btn.textContent = "同期"; btn.classList.remove("on"); btn.title = "Googleでログインして同期"; }
}
function onSyncClick() {
  if (typeof firebase === "undefined") { showToast("同期にはネット接続が必要です"); return; }
  if (fbUser) {
    if (confirm("同期をオフにしますか？(ログアウト)\n履歴はこの端末に残ります")) firebase.auth().signOut();
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(err => {
    const code = err && err.code;
    if (["auth/popup-blocked", "auth/cancelled-popup-request", "auth/operation-not-supported-in-this-environment", "auth/popup-closed-by-user"].includes(code)) {
      firebase.auth().signInWithRedirect(provider);
    } else {
      console.warn(err);
      showToast("ログインできませんでした");
    }
  });
}
renderHistory();
</script>
</body>
</html>
